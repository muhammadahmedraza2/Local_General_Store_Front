<div class="container">

  <!-- HEADER -->
  <div class="header">
    Smart Store
  </div>

  <!-- CONTENT -->
  <div class="content-area">

    <!-- TOTAL PRODUCTS -->
    <button
      class="products-btn"
      [disabled]="products.length === 0">

      All Products ({{ totalRecords }})
    </button>

    <hr />

    <!-- LOADING -->
    <div *ngIf="loading" class="text-center my-4">
      Loading products...
    </div>

    <!-- CATEGORIES -->
    <div *ngFor="let cat of categories">

      <h2 class="category-title">
        {{ cat }}
      </h2>

      <hr />

      <div class="product-row">

        <app-product-card
          *ngFor="let p of groupedProducts[cat]"
          [product]="p"
          (add)="addToCart(p)">
        </app-product-card>

      </div>

    </div>

    <!-- PAGINATION -->
    <div class="pagination-box">

      <button
        class="page-btn"
        (click)="previousPage()"
        [disabled]="pageNumber === 1">

        Previous
      </button>

      <span class="page-text">
        Page {{ pageNumber }} of {{ totalPages }}
      </span>

      <button
        class="page-btn"
        (click)="nextPage()"
        [disabled]="pageNumber === totalPages">

        Next
      </button>

    </div>

  </div>
</div>
