<div class="cat-page">
  <!-- Top Bar -->
  <div class="top-bar">
    <h4>Category Management</h4>
    <button class="btn-add" (click)="openAddModal()">
      <i class="bi bi-plus-lg"></i> Add Category
    </button>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <span class="stat-label">Total</span>
      <span class="stat-val">{{ totalCount }}</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Active</span>
      <span class="stat-val green">{{ activeCount }}</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Inactive</span>
      <span class="stat-val amber">{{ inactiveCount }}</span>
    </div>
  </div>

  <!-- Table -->
  <div class="table-card">
    <div class="table-header">
      <span class="table-title">All Categories</span>
      <input
        type="text"
        class="search-box"
        placeholder="Search category..."
        (input)="search($event)"
      />
    </div>
<div class="table-wrapper">

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Image</th>
          <th>Category Name</th>
          <th>Description</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cat of filtered; let i = index">
          <td>{{ i + 1 }}</td>
          <td>
            <img
              *ngIf="cat.imageUrl"
              [src]="'http://localhost:5000/Uploads/' + cat.imageUrl"
              class="cat-img"
              alt="cat"
            />
            <div *ngIf="!cat.imageUrl" class="cat-placeholder">
              <i class="bi bi-image"></i>
            </div>
          </td>
          <td>
            <strong>{{ cat.name }}</strong>
          </td>
          <td class="muted">
            <strong> {{ cat.description }} </strong>
          </td>
          <td>
            <span
              class="badge"
              [ngClass]="
                cat.status === 'Active' ? 'badge-active' : 'badge-inactive'
              "
            >
              {{ cat.status }}
            </span>
          </td>
          <td>
            <button class="btn-edit" (click)="openEditModal(cat)">
              <i class="bi bi-pencil"></i> Edit
            </button>
            <button class="btn-del" (click)="deleteCategory(cat.id)">
              <i class="bi bi-trash"></i> Delete
            </button>
          </td>
        </tr>

        <tr *ngIf="filtered.length === 0">
          <td colspan="6" class="empty-row">No categories found.</td>
        </tr>
      </tbody>
    </table>
</div>
  </div>

  <!-- Modal -->
  <div class="modal-bg" *ngIf="showModal" (click)="closeModal()">
    <div class="modal-box" (click)="$event.stopPropagation()">
      <h5 class="modal-title">
        {{ isEdit ? "Edit Category" : "Add Category" }}
      </h5>

      <div class="form-group">
        <label>Category Name *</label>
        <input type="text" [(ngModel)]="form.name" placeholder="e.g. Sabun" />
      </div>

      <div class="form-group">
        <label>Description</label>
        <input
          type="text"
          [(ngModel)]="form.desc"
          placeholder="Short description..."
        />
      </div>

      <div class="form-group">
        <label>Image</label>
        <input type="file" accept="image/*" (change)="onFileSelected($event)" />
        <img *ngIf="previewUrl" [src]="previewUrl" class="preview-img" />
      </div>

      <div class="form-group">
        <label>Status</label>
        <select [(ngModel)]="form.status">
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>
      </div>

      <div class="modal-footer">
        <button class="btn-cancel" (click)="closeModal()">Cancel</button>
        <button class="btn-save" (click)="saveCategory()">Save</button>
      </div>
    </div>
  </div>
</div>
