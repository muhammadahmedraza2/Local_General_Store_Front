<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar" [class.collapsed]="isCollapsed">

<div class="logo">
  <i class="bi bi-cart-fill me-2"></i>
  {{ isCollapsed ? 'Store' : 'Store Panel' }}
</div>
<nav>
  <a routerLink="/" routerLinkActive="active">
    <i class="bi bi-house-door-fill"></i>
    {{ isCollapsed ? '' : 'Home' }}
  </a>

  <a routerLink="/product" routerLinkActive="active">
    <i class="bi bi-bag-fill"></i>
    {{ isCollapsed ? '' : 'Product' }}
  </a>

  <a routerLink="/invoice" routerLinkActive="active">
    <i class="bi bi-receipt-cutoff"></i>
    {{ isCollapsed ? '' : 'Invoice' }}
  </a>

  <a routerLink="/order-history" routerLinkActive="active">
    <i class="bi bi-clock-history"></i>
    {{ isCollapsed ? '' : 'Order History' }}
  </a>
</nav>

  </aside>

  <!-- MAIN AREA -->
  <div class="main">

    <header class="topbar">

      <!-- TOGGLE BUTTON -->
      <button class="toggle-btn" (click)="toggleSidebar()">
        ☰
      </button>

      <h3>Local General Store System</h3>

    </header>

    <div class="content">
      <router-outlet></router-outlet>
    </div>

  </div>

</div>
