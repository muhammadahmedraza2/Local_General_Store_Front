<div class="product-card">

  <div class="badge">
    {{ product.category }}
  </div>

  <div class="image-box">
    <img [src]="product.image || 'assets/no-image.png'" />
  </div>

  <div class="details">

    <h3>{{ product.name }}</h3>

    <p>
      Size: {{ product.size }}
    </p>

    <div class="bottom">

      <span class="price">
        Rs {{ product.price }}
      </span>

      <button (click)="addToCart()">
        🛒 Add to Cart
      </button>

    </div>

  </div>

</div>
