<div class="invoice">

  <div class="invoice-header">
    <h2>🧾 Invoice</h2>
    <!-- <p>Date: {{ today }}</p> -->
  </div>

  <table>

    <thead>
      <tr>
        <th>Item</th>
        <th>Qty</th>
        <th>Price</th>
        <th>Total</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let item of cartItems">
        <td>{{ item.name || '--' }}</td>
        <td>{{ item.qty }}</td>
        <td>{{ item.price }}</td>
        <td>{{ item.price * item.qty }}</td>
      </tr>
    </tbody>

  </table>

  <div class="invoice-total">
    <!-- <h3>Total: Rs {{ total }}</h3> -->
  </div>

  <button onclick="window.print()">Print</button>

</div>
